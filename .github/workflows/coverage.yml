name: Coverage

on:
  push:
    branches:
      - main
      - coverage-setup
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lcov \
            build-essential \
            cmake \
            zlib1g-dev \
            libffi-dev \
            libedit-dev \
            libxml2-dev \
            libzstd-dev

          # Add LLVM apt repo to get clang-17 and headers
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"
          sudo apt-get install -y \
            clang-17 \
            clang-tools-17 \
            llvm-17-dev \
            libclang-17-dev

          # Install gcovr for coverage reporting
          pip install gcovr

      - name: Configure with coverage
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build project
        run: cmake --build build --config Debug -j$(nproc)

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure --verbose
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Generate lcov coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,gcov
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Generate gcovr coverage report
        run: |
          mkdir -p coverage-report
          gcovr --root . \
                --filter=".*\.cpp" \
                --exclude-directories="build/_deps" \
                --exclude-directories="tests" \
                --exclude="/usr/*" \
                --txt coverage-report/coverage.txt \
                --xml coverage-report/coverage.xml \
                --html-details coverage-report/index.html
          cat coverage-report/coverage.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage-report

  deploy-coverage:
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
