name: Coverage

on:
  push:
    branches:
      - main
      - coverage-setup
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lcov \
            build-essential \
            cmake \
            zlib1g-dev \
            libffi-dev \
            libedit-dev \
            libxml2-dev \
            libzstd-dev \
            wget

          # Add LLVM apt repo to get clang-17 and headers
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"
          sudo apt-get install -y \
            clang-17 \
            clang-tools-17 \
            llvm-17-dev \
            libclang-17-dev

      - name: Configure with coverage
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON \
          -DCMAKE_C_COMPILER=clang-17 -DCMAKE_CXX_COMPILER=clang++-17

      - name: Build project
        run: cmake --build build --config Debug -j$(nproc)

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure --verbose
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Generate coverage report
        run: |
          # Capture coverage
          lcov --capture --directory build --output-file coverage.info \
               --rc lcov_branch_coverage=1 \
               --rc geninfo_unexecuted_blocks=1 \
               --rc geninfo_check_mismatch=0
          # Remove system and test files
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
          # List coverage
          lcov --list coverage.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info
